<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10121f">
  <title>Станция Ноль</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #10121f;
      --panel: rgba(25, 28, 47, .88);
      --text: #f3f0e9;
      --muted: #a7a9bd;
      --gold: #f2c879;
      --blue: #a5c8ff;
      --border: rgba(255,255,255,.1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(86, 91, 157, .27), transparent 55%),
        radial-gradient(ellipse at 90% 80%, rgba(115, 67, 117, .16), transparent 45%),
        var(--bg);
    }

    button { font: inherit; }

    .app {
      width: min(100%, 560px);
      min-height: 100vh;
      margin: 0 auto;
      padding: max(20px, env(safe-area-inset-top)) 18px
        max(24px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 4px 0 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .moon {
      width: 43px;
      height: 43px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: rgba(255,255,255,.06);
      color: var(--gold);
      font-size: 23px;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .brand-title {
      font-weight: 750;
      letter-spacing: .04em;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .reset {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 12px;
      padding: 9px 11px;
      font-size: 12px;
      cursor: pointer;
    }

    .sky {
      height: 154px;
      margin: 0 0 18px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border);
      border-radius: 22px;
      background:
        radial-gradient(circle at 70% 27%, rgba(255,255,255,.9) 0 1px, transparent 2px),
        radial-gradient(circle at 21% 40%, rgba(255,255,255,.7) 0 1px, transparent 2px),
        radial-gradient(circle at 48% 20%, rgba(255,255,255,.65) 0 1px, transparent 2px),
        linear-gradient(160deg, #242644, #17192a 70%);
      background-size: auto, auto, auto, auto;
    }

    .sky::before {
      content: "";
      position: absolute;
      width: 76px;
      height: 76px;
      right: 15%;
      top: 21px;
      border-radius: 50%;
      background: #f2d89e;
      box-shadow: 0 0 42px rgba(242,216,158,.28);
    }

    .sky::after {
      content: "╱╲    ╱╲       ╱╲";
      position: absolute;
      inset: auto -6px 12px;
      color: #0c0e18;
      font-size: 55px;
      letter-spacing: 8px;
      white-space: nowrap;
      text-shadow: 0 12px 0 #111320;
    }

    .track {
      position: absolute;
      z-index: 1;
      height: 2px;
      left: 0;
      right: 0;
      bottom: 20px;
      background: rgba(242,200,121,.5);
      box-shadow: 0 5px 0 rgba(242,200,121,.18);
    }

    .status {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
      margin: 0 3px 12px;
    }

    .progress {
      height: 4px;
      border-radius: 9px;
      background: rgba(255,255,255,.08);
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-fill {
      height: 100%;
      width: 12%;
      background: linear-gradient(90deg, var(--blue), var(--gold));
      transition: width .4s ease;
    }

    .card {
      flex: 1;
      padding: 23px 20px 20px;
      border: 1px solid var(--border);
      border-radius: 23px;
      background: var(--panel);
      box-shadow: 0 18px 55px rgba(0,0,0,.2);
      animation: appear .35s ease both;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chapter {
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: 10px;
      font-weight: 750;
      margin-bottom: 11px;
    }

    h1 {
      font-size: clamp(24px, 7vw, 33px);
      line-height: 1.12;
      margin: 0 0 16px;
      letter-spacing: -.035em;
    }

    .story {
      color: #dcdeea;
      font-size: 15px;
      line-height: 1.72;
      white-space: pre-line;
    }

    .quote {
      margin-top: 17px;
      padding: 13px 15px;
      border-left: 2px solid var(--gold);
      border-radius: 0 12px 12px 0;
      background: rgba(242,200,121,.07);
      color: #f4dfb4;
      font-size: 14px;
      line-height: 1.55;
    }

    .choices {
      display: grid;
      gap: 10px;
      margin-top: 24px;
    }

    .choice {
      width: 100%;
      text-align: left;
      border: 1px solid rgba(165,200,255,.2);
      border-radius: 15px;
      padding: 14px 15px;
      color: var(--text);
      background: rgba(165,200,255,.065);
      cursor: pointer;
      transition: transform .16s ease, background .16s ease, border-color .16s ease;
    }

    .choice:hover, .choice:focus-visible {
      outline: none;
      transform: translateY(-1px);
      border-color: rgba(242,200,121,.55);
      background: rgba(242,200,121,.1);
    }

    .choice small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      margin-top: 4px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(25px, env(safe-area-inset-bottom));
      transform: translate(-50%, 20px);
      padding: 11px 16px;
      background: #f2c879;
      color: #171522;
      border-radius: 14px;
      font-weight: 700;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: .25s ease;
      z-index: 5;
      width: max-content;
      max-width: calc(100% - 32px);
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    footer {
      color: rgba(167,169,189,.65);
      font-size: 11px;
      text-align: center;
      padding-top: 16px;
    }

    @media (max-height: 700px) {
      .sky { height: 112px; }
      .sky::before { width: 58px; height: 58px; }
      .card { padding-top: 18px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div class="brand">
        <button class="moon" id="moon" aria-label="Луна">☾</button>
        <div>
          <div class="brand-title">СТАНЦИЯ НОЛЬ</div>
          <div class="brand-subtitle">история, которая помнит тебя</div>
        </div>
      </div>
      <button class="reset" id="reset">Начать заново</button>
    </header>

    <div class="sky" aria-hidden="true"><div class="track"></div></div>

    <div class="status">
      <span id="chapterLabel">Ночная смена</span>
      <span id="memoryLabel">Память: 0/3</span>
    </div>

    <div class="progress"><div class="progress-fill" id="progress"></div></div>

    <section class="card" id="card" aria-live="polite"></section>

    <footer>Некоторые двери открываются только тем, кто внимательно смотрит на луну.</footer>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const SAVE_KEY = "station-zero-save-v1";

    const scenes = {
      start: {
        chapter: "Пролог · 02:17",
        title: "Поезд, которого нет",
        text: "На пустой станции гаснут все фонари, кроме одного.\n\nИз темноты выходит поезд без номера. В окне последнего вагона кто-то пишет пальцем на запотевшем стекле: «Ты опоздал. Или ещё нет?»",
        quote: "Голос из старого громкоговорителя: «Пассажир, назовите станцию назначения».",
        progress: 10,
        choices: [
          { label: "Ответить: «Домой»", note: "Ты не уверен, что помнишь дорогу.", next: "platform", effect: { memory: 1 } },
          { label: "Спросить, кто пишет в окне", note: "Иногда правильный вопрос страшнее ответа.", next: "window", effect: { asked: true } }
        ]
      },

      window: {
        chapter: "Вагон · последнее окно",
        title: "Твоим почерком",
        text: "За стеклом стоит девочка в жёлтом шарфе. Ты не видишь её лица, но узнаёшь почерк на стекле.\n\nОна поднимает ладонь. На её запястье — такие же часы, как у тебя. Они остановились на 02:17.",
        quote: "«Не верь расписанию. Оно составлено для тех, кто уже уехал».",
        progress: 23,
        choices: [
          { label: "Показать ей свои часы", next: "platform", effect: { memory: 1, sawGirl: true } },
          { label: "Отойти и осмотреть платформу", next: "platform", effect: { cautious: true } }
        ]
      },

      platform: {
        chapter: "Глава I · платформа",
        title: "Станция без имени",
        text: "Двери открываются. На платформе стоят три фонаря, но свет падает только от двух.\n\nПод скамьёй ты находишь медный жетон с надписью «Ноль». На обратной стороне нацарапано: «Если забыл — вспомни звук».",
        quote: "Из тоннеля доносится мелодия, которую ты давно не слышал.",
        progress: 42,
        choices: [
          { label: "Поднять жетон и идти на звук", note: "Мелодия кажется знакомой.", next: "signal", effect: { token: true, memory: 1 } },
          { label: "Проверить дверь дежурного", note: "Вдруг там есть расписание.", next: "booth", effect: { token: true } }
        ]
      },

      booth: {
        chapter: "Комната дежурного",
        title: "Запись в журнале",
        text: "В журнале ровно одна запись. Дата сегодняшняя, хотя чернила выцвели:\n\n«Когда поезд вернётся, не спрашивай, кто пассажир. Спроси, кого он ждёт».\n\nРядом лежит ключ с крошечной звёздочкой.",
        quote: "В зеркале за спиной на секунду отражается не комната, а море.",
        progress: 57,
        choices: [
          { label: "Взять ключ и вернуться к тоннелю", next: "signal", effect: { key: true } },
          { label: "Посмотреть в зеркало ещё раз", note: "Отражение может знать больше тебя.", next: "mirror", effect: { memory: 1 } }
        ]
      },

      mirror: {
        chapter: "Отражение",
        title: "Море внутри зеркала",
        text: "В отражении ты видишь ребёнка, который запускает бумажный кораблик. На парусе написано твоё имя.\n\nКораблик исчезает в волне, и на стекле проступает короткая фраза: «Ты обещал вернуться за мной».",
        quote: "Кажется, поезд не увозит тебя. Он пытается что-то вернуть.",
        progress: 67,
        choices: [
          { label: "Не забыть обещание и идти дальше", next: "signal", effect: { promise: true } }
        ]
      },

      signal: {
        chapter: "Глава II · голос в тоннеле",
        title: "Мелодия из детства",
        text: "В тоннеле звучит колыбельная. Ты узнаёшь её, но не можешь вспомнить, кто пел.\n\nУ стены — маленькая дверь. Медный жетон подходит к замку, а найденный ключ — к замочной скважине со звёздочкой.",
        quote: "За дверью тихо стучат три раза. Потом — ещё один.",
        progress: 80,
        choices: [
          { label: "Открыть дверь жетоном", note: "На жетоне будто проступает слово «мама».", next: "ending_home", effect: { memory: 1 } },
          { label: "Постучать в ответ: три раза и один", note: "Повторить ритм из-за двери.", next: "ending_reunion", effect: { memory: 1 } },
          { label: "Вставить ключ со звёздочкой", note: "Этот выбор откроется, если ты нашёл ключ.", next: "ending_star", effect: { starDoor: true }, requires: "key" }
        ]
      },

      ending_home: {
        chapter: "Концовка · домой",
        title: "Утро на знакомой улице",
        text: "Дверь открывается — и за ней не тоннель, а твой старый двор на рассвете.\n\nКолыбельная звучит уже совсем рядом. На подоконнике лежит медный жетон. Теперь на нём написано не «Ноль», а «Помни».\n\nТы просыпаешься с ощущением, что впервые за долгое время пришёл вовремя.",
        quote: "Концовка: «Домой». Но кто именно ждал тебя за дверью?",
        progress: 100,
        ending: true
      },

      ending_reunion: {
        chapter: "Концовка · обещание",
        title: "Четвёртый стук",
        text: "Из-за двери отвечают тем же ритмом: три раза и один.\n\nДевочка в жёлтом шарфе выходит из темноты. Теперь ты видишь её лицо — это ты, только намного младше.\n\n«Ты всё-таки вернулся», — говорит она. Поезд впервые за ночь включает свет во всех окнах.",
        quote: "Концовка: «Я помню». Иногда этого достаточно, чтобы найти дорогу.",
        progress: 100,
        ending: true
      },

      ending_star: {
        chapter: "Концовка · звёздная дверь",
        title: "Море над рельсами",
        text: "Ключ поворачивается. Дверь распахивается в ночное море, полное звёзд.\n\nНа берегу ждёт бумажный кораблик из твоего детства. Ты запускаешь его по волне, и поезд тихо уходит в небо.\n\nНа следующее утро на станции появляется новое расписание. В нём есть только один рейс: «Туда, где тебя помнят».",
        quote: "Особая концовка: «Звёздный берег». Ты собрал ключ и не забыл обещание.",
        progress: 100,
        ending: true,
        requires: "promise"
      },

      ending_secret: {
        chapter: "Секретная концовка · 0417",
        title: "Не поезд, а воспоминание",
        text: "Ты нажимаешь на луну семь раз. Она мерцает, как старый фонарь.\n\nЗа дверью вместо вагона — тихая комната, запах чая и голос, который ты пытался вспомнить всю ночь. На столе лежит билет без даты.\n\n«Теперь ты знаешь, — говорит голос. — Станция не держит тебя. Она помогает попрощаться».\n\nПоезд растворяется в утреннем тумане.",
        quote: "Секретная концовка: «Станция помнит». Луна открыла тебе то, что не было написано в расписании.",
        progress: 100,
        ending: true
      }
    };

    const freshState = () => ({
      scene: "start",
      memory: 0,
      flags: {},
      moonTaps: 0,
      secret: false
    });

    let state;
    try {
      state = { ...freshState(), ...JSON.parse(localStorage.getItem(SAVE_KEY) || "{}") };
    } catch {
      state = freshState();
    }

    const card = document.getElementById("card");
    const toast = document.getElementById("toast");
    let toastTimer;

    function save() {
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
    }

    function isAvailable(choice) {
      if (!choice.requires) return true;
      if (choice.requires === "key") return !!state.flags.key;
      if (choice.requires === "promise") return !!state.flags.promise;
      return !!state.flags[choice.requires];
    }

    function render() {
      const scene = scenes[state.scene] || scenes.start;

      document.getElementById("chapterLabel").textContent = scene.chapter;
      document.getElementById("memoryLabel").textContent = `Память: ${Math.min(state.memory, 3)}/3`;
      document.getElementById("progress").style.width = `${scene.progress || 10}%`;

      const choices = scene.ending
        ? [{ label: "Сесть на поезд ещё раз", note: "История начнётся заново. Пасхалка останется открытой.", next: "start", restart: true }]
        : (scene.choices || []).filter(isAvailable);

      card.innerHTML = `
        <div class="chapter">${scene.chapter}</div>
        <h1>${scene.title}</h1>
        <div class="story">${scene.text}</div>
        ${scene.quote ? `<div class="quote">${scene.quote}</div>` : ""}
        <div class="choices">
          ${choices.map((choice, index) => `
            <button class="choice" data-choice="${index}">
              ${choice.label}
              ${choice.note ? `<small>${choice.note}</small>` : ""}
            </button>
          `).join("")}
        </div>
      `;

      card.querySelectorAll(".choice").forEach((button, index) => {
        button.addEventListener("click", () => choose(choices[index]));
      });
    }

    function choose(choice) {
      if (choice.restart) {
        const keepSecret = state.secret;
        state = freshState();
        state.secret = keepSecret;
        save();
        render();
        return;
      }

      if (choice.effect) {
        if (choice.effect.memory) state.memory += choice.effect.memory;
        for (const [key, value] of Object.entries(choice.effect)) {
          if (key !== "memory" && value === true) state.flags[key] = true;
        }
      }

      state.scene = choice.next;
      save();
      render();
    }

    document.getElementById("moon").addEventListener("click", () => {
      state.moonTaps += 1;

      if (state.moonTaps >= 7 && !state.secret) {
        state.secret = true;
        save();
        showToast("Пасхалка открыта: луна знает секретную дорогу.");
        render();
      } else if (state.moonTaps < 7) {
        showToast(`Луна мерцает… ${state.moonTaps}/7`);
      }
    });

    document.getElementById("reset").addEventListener("click", () => {
      const keepSecret = state.secret;
      state = freshState();
      state.secret = keepSecret;
      save();
      render();
      showToast("История началась сначала.");
    });

    // Секретная концовка появляется после семи нажатий на луну.
    // Добавляем путь к ней на сцене с голосом в тоннеле.
    const originalSignalChoices = scenes.signal.choices;
    scenes.signal.choices = originalSignalChoices;

    const originalRender = render;
    render = function () {
      originalRender();

      if (state.scene === "signal" && state.secret) {
        const secretButton = document.createElement("button");
        secretButton.className = "choice";
        secretButton.innerHTML = 'Произнести: «0417»<small>Секретный код, которого нет в расписании.</small>';
        secretButton.addEventListener("click", () => {
          state.scene = "ending_secret";
          save();
          render();
        });
        card.querySelector(".choices").appendChild(secretButton);
      }
    };

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#10121f");
      tg.setBackgroundColor("#10121f");
    }

    render();
  </script>
</body>
</html>
