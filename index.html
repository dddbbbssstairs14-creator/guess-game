<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11131b">
  <title>Дело №17: Алмаз</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #11131b;
      --panel: #1c202b;
      --panel2: #252a38;
      --line: #383e4f;
      --text: #f3f0e8;
      --muted: #a7adbd;
      --gold: #efc477;
      --cyan: #a2dde0;
      --green: #9bd6a3;
      --red: #ef8880;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 50% -10%, #343044 0, transparent 48%),
        var(--bg);
    }

    button { font: inherit; }

    .app {
      width: min(100%, 560px);
      min-height: 100vh;
      margin: auto;
      padding: max(16px, env(safe-area-inset-top)) 15px
        max(24px, env(safe-area-inset-bottom));
    }

    header, .topline, .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
      font-weight: 800;
    }

    h1 { margin: 4px 0 0; font-size: 22px; }

    .reset, .tab, .room, .soft-button {
      border: 1px solid var(--line);
      color: var(--muted);
      background: #191c26;
      border-radius: 12px;
      cursor: pointer;
    }

    .reset { padding: 9px 11px; font-size: 12px; }

    .mission {
      margin: 14px 0;
      padding: 12px 14px;
      border: 1px solid rgba(239,196,119,.25);
      border-radius: 14px;
      background: rgba(239,196,119,.07);
      color: #e8dfcd;
      font-size: 13px;
      line-height: 1.45;
    }

    .mission b { color: var(--gold); }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 12px;
    }

    .tab { padding: 10px 5px; font-size: 12px; }
    .tab.active {
      color: var(--gold);
      border-color: rgba(239,196,119,.48);
      background: #302b38;
    }

    .panel {
      min-height: 430px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: rgba(28,32,43,.96);
      box-shadow: 0 16px 40px #0003;
    }

    .rooms {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 1px 0 12px;
      scrollbar-width: none;
    }

    .rooms::-webkit-scrollbar { display: none; }

    .room {
      flex: 0 0 auto;
      padding: 9px 11px;
      font-size: 12px;
    }

    .room.active {
      color: var(--text);
      border-color: var(--cyan);
      background: rgba(162,221,224,.1);
    }

    .room.done::after { content: " ✓"; color: var(--green); }

    .scene {
      height: 245px;
      position: relative;
      overflow: hidden;
      border: 1px solid #444354;
      border-radius: 15px;
      background:
        linear-gradient(180deg, #555064 0%, #353545 55%, #20232e 100%);
    }

    .scene.office {
      background: linear-gradient(180deg, #665044 0%, #443631 60%, #20232e 100%);
    }

    .scene.control {
      background: linear-gradient(180deg, #3e6268 0%, #2d4149 55%, #1c222d 100%);
    }

    .scene.hall {
      background: linear-gradient(180deg, #625c4e 0%, #403d37 58%, #20232e 100%);
    }

    .scene::after {
      content: "";
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -42px;
      height: 100px;
      transform: perspective(130px) rotateX(12deg);
      background: repeating-linear-gradient(90deg, #242631 0 44px, #30313d 45px 47px);
      border-top: 2px solid rgba(239,196,119,.25);
    }

    .scene-name {
      position: absolute;
      z-index: 1;
      top: 12px;
      left: 13px;
      color: #ffffffd9;
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      text-shadow: 0 2px 6px #000;
    }

    .object {
      position: absolute;
      z-index: 2;
      width: 44px;
      height: 44px;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(239,196,119,.8);
      border-radius: 50%;
      color: #171820;
      background: var(--gold);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 0 5px rgba(239,196,119,.14), 0 5px 16px #0008;
      animation: pulse 1.8s infinite;
    }

    .object.done {
      color: var(--green);
      background: #233b32;
      border-color: var(--green);
      box-shadow: 0 0 0 4px rgba(155,214,163,.13);
      animation: none;
    }

    @keyframes pulse {
      50% { box-shadow: 0 0 0 9px rgba(239,196,119,.04), 0 5px 16px #0008; }
    }

    .hint {
      margin: 10px 2px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .notice {
      display: none;
      margin-top: 10px;
      padding: 11px 12px;
      border: 1px solid rgba(162,221,224,.25);
      border-radius: 12px;
      background: rgba(162,221,224,.07);
      color: #d7eff0;
      font-size: 13px;
      line-height: 1.5;
    }

    .notice.show { display: block; }

    .section-title {
      margin: 2px 0 12px;
      color: var(--gold);
      font-size: 14px;
      font-weight: 800;
    }

    .list { display: grid; gap: 8px; }

    .item {
      width: 100%;
      padding: 12px;
      text-align: left;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel2);
      cursor: pointer;
    }

    .item.selected {
      border-color: var(--gold);
      background: rgba(239,196,119,.1);
    }

    .item strong { display: block; font-size: 13px; }
    .item small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .primary {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      color: #171820;
      background: var(--gold);
      font-weight: 850;
      cursor: pointer;
    }

    .primary:disabled { opacity: .4; cursor: not-allowed; }

    .deduction, .dialogue {
      margin-top: 9px;
      padding: 12px;
      border: 1px solid rgba(155,214,163,.25);
      border-radius: 12px;
      background: rgba(155,214,163,.07);
      color: #d9efdc;
      font-size: 12px;
      line-height: 1.5;
    }

    .dialogue {
      border-color: rgba(162,221,224,.25);
      background: rgba(162,221,224,.07);
      color: #d7eff0;
    }

    .muted { color: var(--muted); font-size: 12px; line-height: 1.5; }

    .modal-bg {
      display: none;
      position: fixed;
      z-index: 5;
      inset: 0;
      padding: 18px;
      align-items: center;
      justify-content: center;
      background: #000b;
    }

    .modal-bg.show { display: flex; }

    .modal {
      width: min(100%, 360px);
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #20232f;
    }

    .modal h2 { margin: 0 0 7px; font-size: 19px; }
    .modal p { color: var(--muted); font-size: 12px; line-height: 1.45; }

    .code {
      width: 100%;
      margin: 5px 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #11131b;
      color: var(--gold);
      font-size: 24px;
      letter-spacing: .4em;
      text-align: center;
    }

    .modal-row { display: flex; gap: 8px; }
    .modal-row button { flex: 1; }

    .toast {
      position: fixed;
      z-index: 9;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translate(-50%, 14px);
      opacity: 0;
      pointer-events: none;
      padding: 11px 15px;
      border-radius: 13px;
      background: var(--gold);
      color: #171820;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      transition: .2s ease;
      width: max-content;
      max-width: calc(100% - 32px);
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div>
        <div class="eyebrow">Интерактивное дело №17</div>
        <h1>Пропавший алмаз</h1>
      </div>
      <button class="reset" id="restart">Сбросить</button>
    </header>

    <div class="mission">
      <b>Цель:</b> найти в музее алмаз и определить, кто отключил охрану.
      Осматривай комнаты, собирай улики и связывай их на доске.
    </div>

    <nav class="tabs">
      <button class="tab active" data-tab="search">🔎 Осмотр</button>
      <button class="tab" data-tab="board">🧩 Улики</button>
      <button class="tab" data-tab="interview">🗣 Подозреваемые</button>
    </nav>

    <section class="panel" id="content"></section>
  </main>

  <div class="modal-bg" id="modal">
    <div class="modal">
      <h2>Пульт охраны</h2>
      <p>Введи четырёхзначный код. Подсказка спрятана в кабинете директора.</p>
      <input class="code" id="codeInput" inputmode="numeric" maxlength="4" placeholder="••••">
      <div class="modal-row">
        <button class="reset" id="closeModal">Закрыть</button>
        <button class="primary" style="margin:0" id="submitCode">Проверить</button>
      </div>
      <div class="notice" id="codeNotice"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SAVE = "detective-case-17-v1";

    const clues = {
      shards: {
        title: "Осколки витрины",
        text: "Стекло разбито внутрь зала. Похоже, витрину вскрыли снаружи."
      },
      dust: {
        title: "Пустая подставка",
        text: "На пыли остался прямоугольный след. Алмаз забрали в перчатках."
      },
      note: {
        title: "Записка с кодом",
        text: "На стикере: «Перезапуск системы — 04:17». Похоже на код пульта."
      },
      schedule: {
        title: "График смен",
        text: "В 04:17 в здании должны были быть директор и ночной охранник."
      },
      shutdown: {
        title: "Журнал отключения",
        text: "Охрану выключили вручную с терминала охранника в 21:14."
      },
      camera: {
        title: "Кадр с камеры",
        text: "На записи человек в форме охраны выходит из зала с длинным футляром."
      },
      keys: {
        title: "Журнал ключей",
        text: "Запасной ключ от витрины получил охранник Лев. Возврат не отмечен."
      },
      print: {
        title: "След ботинка",
        text: "У служебного выхода свежий след. Подошва совпадает с форменными ботинками."
      }
    };

    const rooms = {
      gallery: {
        name: "Главный зал",
        style: "",
        objects: [
          { id: "glass", x: 27, y: 58, icon: "✦", clue: "shards" },
          { id: "case", x: 68, y: 50, icon: "◇", clue: "dust" }
        ]
      },
      office: {
        name: "Кабинет директора",
        style: "office",
        objects: [
          { id: "desk", x: 31, y: 58, icon: "▤", clue: "note" },
          { id: "board", x: 73, y: 39, icon: "▦", clue: "schedule" }
        ]
      },
      control: {
        name: "Пост охраны",
        style: "control",
        objects: [
          { id: "terminal", x: 46, y: 58, icon: "⌨", terminal: true },
          { id: "monitor", x: 75, y: 39, icon: "▣", clue: "camera", requiresCode: true }
        ]
      },
      hall: {
        name: "Служебный коридор",
        style: "hall",
        objects: [
          { id: "keys", x: 27, y: 52, icon: "⚿", clue: "keys" },
          { id: "footprint", x: 73, y: 69, icon: "◉", clue: "print" }
        ]
      }
    };

    const suspects = [
      { id: "lev", name: "Лев", role: "Ночной охранник" },
      { id: "vera", name: "Вера", role: "Директор музея" },
      { id: "mira", name: "Мира", role: "Реставратор" }
    ];

    function freshState() {
      return {
        tab: "search",
        room: "gallery",
        found: [],
        codeOpen: false,
        selected: [],
        deductions: [],
        interviewed: [],
        dialogue: "",
        result: ""
      };
    }

    let state;
    try {
      state = { ...freshState(), ...JSON.parse(localStorage.getItem(SAVE) || "{}") };
    } catch {
      state = freshState();
    }

    const content = document.getElementById("content");
    const modal = document.getElementById("modal");
    let toastTimer;

    function save() {
      localStorage.setItem(SAVE, JSON.stringify(state));
    }

    function has(id) {
      return state.found.includes(id);
    }

    function notify(text) {
      const toast = document.getElementById("toast");
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function collect(id) {
      if (!has(id)) {
        state.found.push(id);
        save();
        notify("Улика добавлена в дело");
      } else {
        notify("Ты уже осмотрел это место");
      }
      render();
    }

    function renderSearch() {
      const room = rooms[state.room];
      content.innerHTML = `
        <div class="rooms">
          ${Object.entries(rooms).map(([id, r]) => `
            <button class="room ${state.room === id ? "active" : ""} ${r.objects.every(o => o.terminal || has(o.clue)) ? "done" : ""}"
              data-room="${id}">${r.name}</button>
          `).join("")}
        </div>
        <div class="scene ${room.style}">
          <div class="scene-name">${room.name}</div>
          ${room.objects.map(o => {
            const isDone = o.clue && has(o.clue);
            const locked = o.requiresCode && !state.codeOpen;
            return `<button class="object ${isDone ? "done" : ""}" data-object="${o.id}"
              style="left:${o.x}%;top:${o.y}%" aria-label="Осмотреть объект">
              ${locked ? "?" : isDone ? "✓" : o.icon}
            </button>`;
          }).join("")}
        </div>
        <div class="hint">Нажимай на отмеченные объекты. Некоторые улики можно найти только после открытия пульта.</div>
        <div class="notice show" id="searchNotice">Ищи внимательно: улики разбросаны по четырём комнатам.</div>
      `;

      content.querySelectorAll("[data-room]").forEach(button => {
        button.onclick = () => {
          state.room = button.dataset.room;
          save();
          render();
        };
      });

      content.querySelectorAll("[data-object]").forEach(button => {
        button.onclick = () => inspect(button.dataset.object);
      });
    }

    function inspect(objectId) {
      const room = rooms[state.room];
      const object = room.objects.find(o => o.id === objectId);
      if (!object) return;

      if (object.terminal) {
        if (!state.found.includes("note")) {
          notify("Пульт заблокирован. Сначала найди подсказку в кабинете.");
          return;
        }
        document.getElementById("codeInput").value = "";
        document.getElementById("codeNotice").className = "notice";
        modal.classList.add("show");
        return;
      }

      if (object.requiresCode && !state.codeOpen) {
        notify("Монитор выключен. Сначала разблокируй пульт.");
        return;
      }

      collect(object.clue);
    }

    function renderBoard() {
      const selected = state.selected;
      content.innerHTML = `
        <div class="title-row">
          <div class="section-title">Доска расследования</div>
          <div class="muted">${state.found.length}/${Object.keys(clues).length} улик</div>
        </div>
        <p class="muted">Выбери две улики и нажми «Сопоставить». Так можно восстановить ход преступления.</p>
        <div class="list">
          ${state.found.length ? state.found.map(id => `
            <button class="item ${selected.includes(id) ? "selected" : ""}" data-clue="${id}">
              <strong>${clues[id].title}</strong>
              <small>${clues[id].text}</small>
            </button>
          `).join("") : `<div class="muted">Пока пусто. Иди на осмотр и найди первую улику.</div>`}
        </div>
        <button class="primary" id="connect" ${selected.length !== 2 ? "disabled" : ""}>Сопоставить две улики</button>
        <div id="deductions">
          ${state.deductions.map(text => `<div class="deduction">${text}</div>`).join("")}
        </div>
      `;

      content.querySelectorAll("[data-clue]").forEach(button => {
        button.onclick = () => {
          const id = button.dataset.clue;
          if (state.selected.includes(id)) {
            state.selected = state.selected.filter(x => x !== id);
          } else if (state.selected.length < 2) {
            state.selected.push(id);
          } else {
            state.selected = [state.selected[1], id];
          }
          save();
          render();
        };
      });

      document.getElementById("connect").onclick = connectClues;
    }

    function connectClues() {
      const pair = [...state.selected].sort().join("|");
      let result = "";

      if (pair === ["note", "shutdown"].sort().join("|")) {
        result = "Код 04:17 дал доступ к журналу, но отключение произошло раньше — в 21:14. Кто-то подготовил преступление заранее.";
      } else if (pair === ["keys", "print"].sort().join("|")) {
        result = "Ключ от витрины и след форменного ботинка ведут к человеку с доступом в служебный коридор.";
      } else if (pair === ["camera", "shutdown"].sort().join("|")) {
        result = "На записи человек в форме охраны. Камеры отключили с рабочего терминала охранника.";
      } else if (pair === ["shards", "dust"].sort().join("|")) {
        result = "Витрину разбили снаружи, но алмаз вынули аккуратно. Разбитое стекло могло быть отвлекающим манёвром.";
      } else {
        result = "Пока связи не видно. Попробуй сопоставить улики, которые относятся к одному месту или времени.";
      }

      if (result.startsWith("Ключ") || result.startsWith("На записи") || result.startsWith("Код")) {
        if (!state.deductions.includes(result)) state.deductions.push(result);
      } else {
        notify(result);
      }

      state.selected = [];
      save();
      render();
    }

    function renderInterview() {
      content.innerHTML = `
        <div class="section-title">Допросная</div>
        <p class="muted">Выбирай подозреваемого. Улики помогают задавать правильные вопросы.</p>
        <div class="list">
          ${suspects.map(s => `
            <button class="item ${state.interviewed.includes(s.id) ? "selected" : ""}" data-suspect="${s.id}">
              <strong>${s.name}</strong><small>${s.role}</small>
            </button>
          `).join("")}
        </div>
        <div class="dialogue" id="dialogue">${state.dialogue || "Кого вызовем на допрос?"}</div>
        <div class="section-title" style="margin-top:16px">Обвинение</div>
        <p class="muted">Обвиняй, когда соберёшь достаточно доказательств.</p>
        <div class="list">
          ${suspects.map(s => `<button class="item" data-accuse="${s.id}"><strong>Обвинить: ${s.name}</strong></button>`).join("")}
        </div>
        ${state.result ? `<div class="deduction">${state.result}</div>` : ""}
      `;

      content.querySelectorAll("[data-suspect]").forEach(button => {
        button.onclick = () => question(button.dataset.suspect);
      });

      content.querySelectorAll("[data-accuse]").forEach(button => {
        button.onclick = () => accuse(button.dataset.accuse);
      });
    }

    function question(id) {
      let text = "";

      if (id === "lev") {
        if (has("keys") && has("shutdown")) {
          text = "Лев: «Я не брал ключ». Ты показываешь журнал выдачи. Он замолкает: «Ладно… я отключил камеры, но алмаз уже был в футляре».";
        } else if (has("camera")) {
          text = "Лев: «На записи форма похожа на мою. Но в музее таких курток три. Вам нужны более точные улики».";
        } else {
          text = "Лев: «Я был на посту. Проверь
