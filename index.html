<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11131b">
  <title>Дело №17 — Ночной музей</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #11131b;
      --panel: #1b1e29;
      --raised: #252a38;
      --line: #383e4f;
      --text: #f3f0e8;
      --muted: #a7adbd;
      --gold: #efc477;
      --cyan: #a2dde0;
      --green: #9bd6a3;
      --red: #ef8880;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 50% -10%, #343044 0, transparent 48%),
        var(--bg);
    }

    button, input { font: inherit; }

    button { -webkit-tap-highlight-color: transparent; }

    .app {
      width: min(100%, 620px);
      min-height: 100vh;
      margin: auto;
      padding: max(15px, env(safe-area-inset-top)) 14px
        max(24px, env(safe-area-inset-bottom));
    }

    header, .row, .room-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
      font-weight: 850;
    }

    h1 { margin: 4px 0 0; font-size: 22px; }

    .reset, .tab, .room-btn, .secondary {
      border: 1px solid var(--line);
      color: var(--muted);
      background: #191c26;
      border-radius: 12px;
      cursor: pointer;
    }

    .reset { padding: 9px 11px; font-size: 12px; }

    .mission {
      margin: 14px 0 12px;
      padding: 12px 14px;
      border: 1px solid rgba(239,196,119,.25);
      border-radius: 14px;
      background: rgba(239,196,119,.07);
      color: #e8dfcd;
      font-size: 13px;
      line-height: 1.45;
    }

    .mission b { color: var(--gold); }

    .stats {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 11px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 12px;
    }

    .tab { padding: 10px 4px; font-size: 12px; }
    .tab.active {
      color: var(--gold);
      border-color: rgba(239,196,119,.48);
      background: #302b38;
    }

    .panel {
      min-height: 430px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: rgba(27,30,41,.97);
      box-shadow: 0 16px 40px #0003;
    }

    .rooms {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 1px 0 12px;
      scrollbar-width: none;
    }

    .rooms::-webkit-scrollbar { display: none; }

    .room-btn {
      flex: 0 0 auto;
      padding: 9px 11px;
      font-size: 12px;
    }

    .room-btn.active {
      color: var(--text);
      border-color: var(--cyan);
      background: rgba(162,221,224,.1);
    }

    .room-btn.done::after { content: " ✓"; color: var(--green); }

    .scene {
      height: clamp(220px, 60vw, 330px);
      position: relative;
      overflow: hidden;
      border: 1px solid #444354;
      border-radius: 15px;
      background-color: #343545;
      background-image:
        linear-gradient(180deg, #10121a44 0%, #10121a11 30%, #10121a99 100%),
        var(--photo);
      background-position: center;
      background-size: cover;
    }

    .scene-title {
      position: absolute;
      z-index: 1;
      top: 12px;
      left: 13px;
      padding: 6px 9px;
      border-radius: 9px;
      background: #11131bbd;
      color: white;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .hotspot {
      position: absolute;
      z-index: 2;
      width: 43px;
      height: 43px;
      transform: translate(-50%, -50%);
      border: 2px solid #fff4d5;
      border-radius: 50%;
      color: #191820;
      background: var(--gold);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 0 5px #efc47738, 0 5px 16px #0009;
      animation: pulse 1.8s infinite;
    }

    .hotspot.found {
      color: var(--green);
      background: #223b33;
      border-color: var(--green);
      box-shadow: 0 0 0 4px #9bd6a322;
      animation: none;
    }

    @keyframes pulse {
      50% { box-shadow: 0 0 0 9px #efc47718, 0 5px 16px #0009; }
    }

    .hint {
      margin: 10px 2px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .notice, .deduction, .dialogue {
      margin-top: 10px;
      padding: 11px 12px;
      border: 1px solid rgba(162,221,224,.25);
      border-radius: 12px;
      background: rgba(162,221,224,.07);
      color: #d7eff0;
      font-size: 13px;
      line-height: 1.5;
    }

    .section-title {
      margin: 3px 0 10px;
      color: var(--gold);
      font-size: 14px;
      font-weight: 850;
    }

    .muted { color: var(--muted); font-size: 12px; line-height: 1.5; }

    .list { display: grid; gap: 8px; }

    .item {
      width: 100%;
      padding: 12px;
      text-align: left;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--raised);
      cursor: pointer;
    }

    .item.selected {
      border-color: var(--gold);
      background: rgba(239,196,119,.1);
    }

    .item strong { display: block; font-size: 13px; }
    .item small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .primary {
      width: 100%;
      margin-top: 11px;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      color: #171820;
      background: var(--gold);
      font-weight: 850;
      cursor: pointer;
    }

    .primary:disabled { opacity: .4; cursor: not-allowed; }

    .deduction {
      border-color: rgba(155,214,163,.25);
      background: rgba(155,214,163,.07);
      color: #d9efdc;
      font-size: 12px;
    }

    .dialogue {
      border-color: rgba(162,221,224,.25);
      background: rgba(162,221,224,.07);
      color: #d7eff0;
    }

    .modal-bg {
      display: none;
      position: fixed;
      z-index: 5;
      inset: 0;
      padding: 18px;
      align-items: center;
      justify-content: center;
      background: #000c;
    }

    .modal-bg.show { display: flex; }

    .modal {
      width: min(100%, 370px);
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #20232f;
      box-shadow: 0 20px 70px #0009;
    }

    .modal h2 { margin: 0 0 6px; font-size: 19px; }
    .modal p { color: var(--muted); font-size: 12px; line-height: 1.45; }

    .code {
      width: 100%;
      margin: 6px 0 2px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #11131b;
      color: var(--gold);
      font-size: 24px;
      letter-spacing: .4em;
      text-align: center;
    }

    .modal-row { display: flex; gap: 8px; }
    .modal-row button { flex: 1; }

    .toast {
      position: fixed;
      z-index: 9;
      left: 50%;
      bottom: max(23px, env(safe-area-inset-bottom));
      transform: translate(-50%, 14px);
      opacity: 0;
      pointer-events: none;
      padding: 11px 15px;
      border-radius: 13px;
      background: var(--gold);
      color: #171820;
      font-size: 12px;
      font-weight: 850;
      text-align: center;
      transition: .2s ease;
      width: max-content;
      max-width: calc(100% - 32px);
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div>
        <div class="eyebrow">Интерактивное дело №17</div>
        <h1>Ночной музей</h1>
      </div>
      <button class="reset" data-action="reset">Новая игра</button>
    </header>

    <div class="mission">
      <b>Задача:</b> найти пропавший алмаз, восстановить события и выбрать виновного.
      Осматривай комнаты, собирай улики и проверяй версии.
    </div>

    <div class="stats">
      <span id="clue-count">Улики: 0/9</span>
      <span id="status">Дело не раскрыто</span>
    </div>

    <nav class="tabs">
      <button class="tab active" data-tab="search">🔎 Осмотр</button>
      <button class="tab" data-tab="board">🧩 Доска</button>
      <button class="tab" data-tab="interview">🗣 Допрос</button>
    </nav>

    <section class="panel" id="content"></section>
  </main>

  <div class="modal-bg" id="modal">
    <div class="modal">
      <h2>Пульт охраны</h2>
      <p>Введи четырёхзначный код. Подсказка спрятана в кабинете директора.</p>
      <input class="code" id="code-input" inputmode="numeric" maxlength="4" placeholder="••••">
      <div class="modal-row">
        <button class="reset" data-action="close-modal">Закрыть</button>
        <button class="primary" style="margin:0" data-action="submit-code">Проверить</button>
      </div>
      <div id="code-feedback"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SAVE_KEY = "night-museum-case-v2";

    const clueData = {
      shards: {
        title: "Осколки витрины",
        text: "Большая часть стекла лежит внутри. Витрину разбили снаружи, чтобы инсценировать взлом."
      },
      emptyCase: {
        title: "Пустая подставка",
        text: "На подставке нет царапин. Алмаз достали аккуратно — у виновного был ключ."
      },
      codeNote: {
        title: "Стикер под столом",
        text: "На стикере написано: «Перезапуск системы — 04:17»."
      },
      schedule: {
        title: "График смен",
        text: "В ночь кражи в музее дежурили директор Вера и охранник Лев."
      },
      accessLog: {
        title: "Журнал системы",
        text: "Охрану отключили вручную в 21:14 — ещё до закрытия музея."
      },
      camera: {
        title: "Запись камеры",
        text: "На зернистом кадре человек в форме охраны выходит из зала с длинным футляром."
      },
      keyLog: {
        title: "Журнал ключей",
        text: "Запасной ключ от витрины забрал Лев. Отметки о возврате нет."
      },
      footprint: {
        title: "След у выхода",
        text: "Свежий след форменного ботинка ведёт к служебному выходу."
      },
      ledger: {
        title: "Страница инвентарной книги",
        text: "Алмаз проверяли в 20:40. Реставратор Мира записала: «витрина цела»."
      }
    };

    const rooms = {
      gallery: {
        name: "Главный зал",
        photo: "https://images.unsplash.com/photo-1561214115-f2f134cc4912?auto=format&fit=crop&w=1400&q=85",
        objects: [
          { id: "glass", x: 23, y: 62, icon: "✦", clue: "shards" },
          { id: "case", x: 72, y: 54, icon: "◇", clue: "emptyCase" }
        ]
      },
      office: {
        name: "Кабинет директора",
        photo: "https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1400&q=85",
        objects: [
          { id: "desk", x: 31, y: 62, icon: "▤", clue: "codeNote" },
          { id: "schedule", x: 75, y: 38, icon: "▦", clue: "schedule" }
        ]
      },
      security: {
        name: "Пост охраны",
        photo: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1400&q=85",
        objects: [
          { id: "terminal", x: 42, y: 61, icon: "⌨", terminal: true },
          { id: "camera", x: 76, y: 39, icon: "▣", clue: "camera", locked: true }
        ]
      },
      archive: {
        name: "Архив музея",
        photo: "https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=1400&q=85",
        objects: [
          { id: "ledger", x: 30, y: 56, icon: "▤", clue: "ledger" }
        ]
      },
      corridor: {
        name: "Служебный коридор",
        photo: "https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=1400&q=85",
        objects: [
          { id: "keys", x: 28, y: 54, icon: "⚿", clue: "keyLog" },
          { id: "print", x: 76, y: 71, icon: "◉", clue: "footprint" }
        ]
      }
    };

    const suspects = [
      { id: "lev", name: "Лев", job: "Ночной охранник" },
      { id: "vera", name: "Вера", job: "Директор музея" },
      { id: "mira", name: "Мира", job: "Реставратор" }
    ];

    function freshState() {
      return {
        tab: "search",
        room: "gallery",
        found: [],
        selected: [],
        deductions: [],
        codeOpen: false,
        answers: {},
        result: ""
      };
    }

    let state;

    try {
      state = { ...freshState(), ...JSON.parse(localStorage.getItem(SAVE_KEY) || "{}") };
    } catch {
      state = freshState();
    }

    const content = document.getElementById("content");
    const modal = document.getElementById("modal");
    let toastTimer;

    function save() {
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    }

    function hasClue(id) {
      return state.found.includes(id);
    }

    function toast(message) {
      const element = document.getElementById("toast");
      element.textContent = message;
      element.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => element.classList.remove("show"), 2300);
    }

    function render() {
      document.querySelectorAll(".tab").forEach(button => {
        button.classList.toggle("active", button.dataset.tab === state.tab);
      });

      document.getElementById("clue-count").textContent =
        `Улики: ${state.found.length}/${Object.keys(clueData).length}`;

      document.getElementById("status").textContent =
        state.result.startsWith("ДЕЛО РАСКРЫТО") ? "Дело раскрыто ✓" : "Дело не раскрыто";

      if (state.tab === "search") renderSearch();
      if (state.tab === "board") renderBoard();
      if (state.tab === "interview") renderInterview();
    }

    function renderSearch() {
      const room = rooms[state.room];

      content.innerHTML = `
        <div class="rooms">
          ${Object.entries(rooms).map(([id, value]) => {
            const finished = value.objects.every(object =>
              object.terminal || !object.clue || hasClue(object.clue) ||
              (object.locked && !state.codeOpen)
            );
            return `
              <button class="room-btn ${state.room === id ? "active" : ""} ${finished ? "done" : ""}"
                data-action="room" data-id="${id}">${value.name}</button>
            `;
          }).join("")}
        </div>

        <div class="scene" style="--photo:url('${room.photo}')">
          <div class="scene-title">${room.name}</div>
          ${room.objects.map(object => {
            const found = object.clue && hasClue(object.clue);
            const locked = object.locked && !state.codeOpen;
            return `
              <button class="hotspot ${found ? "found" : ""}"
                style="left:${object.x}%;top:${object.y}%"
                data-action="inspect" data-id="${object.id}"
                aria-label="Осмотреть объект">
                ${locked ? "?" : found ? "✓" : object.icon}
              </button>
            `;
          }).join("")}
        </div>

        <div class="hint">
          Нажимай на круглые метки на фотографии. В некоторых комнатах есть закрытые объекты.
        </div>
      `;
    }

    function inspect(objectId) {
      const room = rooms[state.room];
      const object = room.objects.find(item => item.id === objectId);
      if (!object) return;

      if (object.terminal) {
        if (!hasClue("codeNote")) {
          toast("Сначала найди подсказку к коду в кабинете директора.");
          return;
        }

        document.getElementById("code-input").value = "";
        document.getElementById("code-feedback").innerHTML = "";
        modal.classList.add("show");
        return;
      }

      if (object.locked && !state.codeOpen) {
        toast("Монитор выключен. Сначала разблокируй пульт.");
        return;
      }

      if (object.clue && !hasClue(object.clue)) {
        state.found.push(object.clue);
        save();
        toast(`Найдена улика: ${clueData[object.clue].title}`);
        render();
      } else {
        toast("Ты уже осмотрел это место.");
      }
    }

    function renderBoard() {
      content.innerHTML = `
        <div class="row">
          <div class="section-title">Доска расследования</div>
          <div class="muted">${state.found.length} собрано</div>
        </div>
        <p class="muted">Выбери две улики, затем нажми «Сопоставить». Удачные связи добавят вывод в дело.</p>

        <div class="list">
          ${state.found.length ? state.found.map(id => `
            <button class="item ${state.selected.includes(id) ? "selected" : ""}"
              data-action="select-clue" data-id="${id}">
              <strong>${clueData[id].title}</strong>
              <small>${clueData[id].text}</small>
            </button>
          `).join("") : `<div class="muted">Улик пока нет. Отправляйся на осмотр.</div>`}
        </div>

        <button class="primary" data-action="match"
          ${state.selected.length !== 2 ? "disabled" : ""}>
          Сопоставить выбранные улики
        </button>

        ${state.deductions.map(item => `<div class="deduction">${item}</div>`).join("")}
      `;
    }

    function matchClues() {
      if (state.selected.length !== 2) return;

      const pair = state.selected.slice().sort().join("|");
      const combinations = {
        ["codeNote|accessLog"]: "Подсказка с кодом и журнал показывают: подозреваемый знал систему заранее. Отключение было ручным и произошло до закрытия.",
        ["camera|accessLog"]: "Камера показывает человека в форме, а журнал — ручное отключение охраны. Эти события связаны.",
        ["footprint|keyLog"]: "Ключ от витрины забрал Лев. След форменного ботинка ведёт к служебному выходу.",
        ["emptyCase|shards"]: "Витрину разбили для отвлечения внимания, но алмаз вынули аккуратно ключом.",
        ["ledger|schedule"]: "Мира записала, что витрина была цела. По графику после закрытия доступ оставался у директора и охранника."
      };

      const result = combinations[pair];

      if (result) {
        if (!state.deductions.includes(result)) {
          state.deductions.push(result);
          toast("Связь найдена — вывод добавлен на доску.");
        } else {
          toast("Этот вывод уже есть на доске.");
        }
      } else {
        toast("Пока связь неочевидна. Попробуй другую пару улик.");
      }

      state.selected = [];
      save();
      render();
    }

    function renderInterview() {
      const questionButtons = [
        ["night", "Где ты был в момент кражи?"],
        ["keys", "Кто брал ключ от витрины?"],
        ["system", "Что знаешь об отключении охраны?"]
      ];

      content.innerHTML = `
        <div class="section-title">Комната допросов</div>
        <p class="muted">Выбери подозреваемого, затем задай вопрос. Собранные улики меняют ответы.</p>

        <div class="list">
          ${suspects.map(person => `
            <button class="item ${state.selectedSuspect === person.id ? "selected" : ""}"
              data-action="suspect" data-id="${person.id}">
              <strong>${person.name}</strong><small>${person.job}</small>
            </button>
          `).join("")}
        </div>

        <div class="list" style="margin-top:10px">
          ${questionButtons.map(([id, text]) => `
            <button class="item" data-action="question" data-id="${id}">${text}</button>
          `).join("")}
        </div>

        <div class="dialogue">
          ${state.dialogue || "Выбери подозреваемого и задай вопрос."}
        </div>

        <div class="section-title" style="margin-top:16px">Предъявить обвинение</div>
        <div class="list">
          ${suspects.map(
