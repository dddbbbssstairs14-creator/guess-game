<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Игра работает</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #11131b;
      color: #efc477;
      font-family: system-ui, sans-serif;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 16px 22px;
      background: #efc477;
      color: #171820;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <button id="play">Запустить игру</button>
  <script>
    document.getElementById("play").addEventListener("click", () => {
      alert("GitHub Pages работает!");
    });
  </script>
</body>
</html>
